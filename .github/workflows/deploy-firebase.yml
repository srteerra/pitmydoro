name: Deploy Firebase

on:
  push:
    branches: [main, master]
    paths:
      - 'functions/**'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-firebase.yml'
  workflow_dispatch:
    inputs:
      project:
        description: 'Firebase project alias to deploy to'
        type: choice
        options: [dev, prod]
        default: dev

concurrency:
  group: ${{ github.workflow }}-${{ inputs.project || 'prod' }}
  cancel-in-progress: false

jobs:
  Deploy:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FIREBASE_PROJECT: ${{ inputs.project || 'prod' }}
      FIREBASE_TOOLS_VERSION: 14.20.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install function dependencies
        run: npm ci --prefix functions

      - name: Build functions
        run: npm run build --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy indexes and functions
        run: |
          npx --yes firebase-tools@"$FIREBASE_TOOLS_VERSION" deploy \
            --only firestore:indexes,functions \
            --project "$FIREBASE_PROJECT" \
            --non-interactive \
            --force
